		<!-- Apply theme colors ans font size -->
		<script>
			// Theme colors
			;(() => {
				const preferredTheme = localStorage.getItem('_preferred_theme') ?? 'system';
				const isDarkMode = preferredTheme === 'dark' ||
					(
						preferredTheme === 'system' &&
						window.matchMedia('(prefers-color-scheme: dark)').matches
					)

					document.documentElement.classList.toggle('dark', isDarkMode)
  				document.querySelector('toast-messages')?.setAttribute('data-mode', isDarkMode ? 'dark' : 'light')
			})()

			// Lead font size
			;(() => {
				const preferredFs = localStorage.getItem('_preferred_font_size') ?? '1';
				document.documentElement.style.fontSize = `${preferredFs}rem`;
			})();
		</script>
